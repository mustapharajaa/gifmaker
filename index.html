<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gif Maker - Create and Preview GIFs Instantly</title>
	<meta name="description"
		content="The simplest way to create and preview GIF animations from your images in real-time.">
	<link rel="icon" type="image/svg+xml" href="i.svg">
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
	<script src="gif.js"></script>
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3505152863660929"
     crossorigin="anonymous"></script>
	<!-- AdBridge Homepage Bridge Tag -->
<script>
(function() {
  const p = new URLSearchParams(window.location.search);
  if (p.has("bridge_ad")) {
    const meta = document.createElement("meta");
    meta.name = "referrer";
    meta.content = "no-referrer";
    document.head.appendChild(meta);

    document.addEventListener("DOMContentLoaded", function() {
      document.body.innerHTML = '<div id="ad-box" style="display:flex;justify-content:center;align-items:center;width:100vw;height:100vh;overflow:hidden;"></div>';
      document.body.style.cssText = "margin:0!important;padding:0!important;overflow:hidden!important;background:transparent!important;";

      const pub  = p.get("pub");
      const slot = p.get("slot");
      const w    = p.get("w") || "300";
      const h    = p.get("h") || "250";

      const ins = document.createElement("ins");
      ins.className = "adsbygoogle";
      ins.style.cssText = "display:inline-block;width:" + w + "px;height:" + h + "px";
      ins.setAttribute("data-ad-client", pub);
      ins.setAttribute("data-ad-slot", slot);
      document.getElementById("ad-box").appendChild(ins);

      const s = document.createElement("script");
      s.async = true;
      s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(pub);
      s.crossOrigin = "anonymous";
      s.onload = () => { (adsbygoogle = window.adsbygoogle || []).push({}); };
      document.head.appendChild(s);
    });
  }
})();
</script>
</head>

<body>
	<div class="grid" id="container">
		<!-- 9 slots with original a.svg to i.svg images -->
		<div class="item">
			<div class="item-content"><img class="img" src="a.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="b.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="c.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="d.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="e.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="f.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="g.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="h.svg"></div>
		</div>
		<div class="item">
			<div class="item-content"><img class="img" src="i.svg"></div>
		</div>
	</div>

	<div class="pane">
		<h1>Gif Maker</h1>

		<p style="color: rgba(0, 0, 0, 0.7);">you'd better keep all you images same size</p>
		<input type="range" id="speed" min="1" max="20" value="5" data-speed="5">

		<button id="clear">Clear Images</button>
		<button id="start">Create GIF</button>
		<button id="reset" style="display: none;">Reset</button>

		<div style="margin-top: 20px; position: relative;">
			<p>Result:</p>
			<div style="position: relative;">
				<img id="result" src="a.svg" style="width: 100%; border-radius: 8px; border: 1px solid #ccc;">
				<div id="popup-message"
					style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 8px; z-index: 10; font-size: 14px; text-align: center; width: 80%; pointer-events: none;">
				</div>
			</div>
			<button id="download" style="margin-top: 10px;">Download GIF</button>
		</div>
	</div>

	<input type="file" id="upload" style="display: none;" accept="image/*" multiple>

	<script src="app.mjs" type="module"></script>
</body>

</html>
